# Xcode プロジェクトの設計図。.xcodeproj はここから生成する(手で書き換えない)。
# 生成: cd app/Shibui && xcodegen
# アプリ名が決まったら name / PRODUCT_BUNDLE_IDENTIFIER / App Group / CFBundleDisplayName を書き換えて再生成する。
name: Shibui
options:
  bundleIdPrefix: com.imshota1009
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: XDBC5QYB9Y
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "38"
packages:
  DesignSystem:
    path: ../DesignSystem
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios
    exactVersion: 6.27.0
targets:
  Shibui:
    type: application
    platform: iOS
    sources:
      - App
      - Models
      - Views
      - Services
    dependencies:
      - package: DesignSystem
      - package: RiveRuntime
      - target: ShibuiActivityMonitor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 抹茶振るネス
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: ja
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [shibui]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imshota1009.spajam2026.shibui
        CODE_SIGN_ENTITLEMENTS: App/Shibui.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
      configs:
        # Screen Time(Family Controls)の許可は、Xcode から入れる開発版(Debug)だけにつける。
        # TestFlight 版(Release)につけると、Apple の承認がないため配布できない
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/ShibuiScreenTime.entitlements
  ShibuiActivityMonitor:
    type: app-extension
    platform: iOS
    sources: [ActivityMonitor]
    info:
      path: ActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: 抹茶振るネス 見張り
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActivityMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imshota1009.spajam2026.shibui.activitymonitor
        CODE_SIGN_ENTITLEMENTS: ActivityMonitor/ActivityMonitor.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ActivityMonitor/ActivityMonitorScreenTime.entitlements
  ShibuiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Shibui
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imshota1009.spajam2026.shibui.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Shibui:
    build:
      targets:
        Shibui: all
    test:
      targets: [ShibuiUITests]
